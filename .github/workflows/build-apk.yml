# ─────────────────────────────────────────────────────────────────────────────
# Auralis Med Spa — Android APK Build Pipeline
#
# Builds the single, unified Auralis app (staff + patient in one):
#   • apps/auralis → Auralis (com.auralis.app)
#
# Role selection happens inside the app: "Continue as Staff" (credentials
# sign-in, provisioned accounts) or "Continue as Patient" (sign-in + sign-up).
#
# Flow:  bun install → expo prebuild (android) → gradlew assembleRelease
# The Expo template signs release builds with the generated debug keystore, so
# the APK installs out of the box (swap in a Play keystore for store deploys).
#
# Triggers:
#   • workflow_dispatch  (manual / API)  — optional GitHub Release upload
#   • push to main       (only when apps/** or this file changes)
# ─────────────────────────────────────────────────────────────────────────────
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Attach the APK to a GitHub Release (apk-latest)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"
  # Point the app at the deployed Auralis web API (set this repo variable to
  # your production URL; falls back to localhost for local dev builds).
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'http://localhost:3000' }}

jobs:
  build:
    name: Build Auralis APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/auralis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: bun install

      - name: Expo prebuild (android)
        run: bunx expo prebuild --platform android --no-install --clean

      - name: Align Kotlin 1.9.25 with Compose Compiler 1.5.15 (expo-modules-core 2.2.3)
        run: |
          # expo@52.0.49 ships expo-modules-core 2.2.3 which embeds Compose
          # Compiler 1.5.15 — hard-requires Kotlin 1.9.25. RN 0.76 pins 1.9.24
          # in TWO version catalogs (consumed via includeBuild + reactAndroidLibs)
          # and in the prebuilt template files. Patch all four surfaces:
          sed -i 's/kotlin = "1\.9\.24"/kotlin = "1.9.25"/' node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml
          sed -i 's/kotlin = "1\.9\.24"/kotlin = "1.9.25"/' node_modules/react-native/gradle/libs.versions.toml
          sed -i 's/1\.9\.24/1.9.25/g' android/build.gradle android/gradle.properties
          echo "--- verify no stale 1.9.24 pins ---"
          grep -rn "1\.9\.24" node_modules/react-native/gradle/libs.versions.toml node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml android/build.gradle android/gradle.properties \
            || echo "✓ all Kotlin pins aligned at 1.9.25"

      - name: Tune Gradle for CI runners
        run: |
          sed -i 's/-Xmx2048m/-Xmx4096m/' android/gradle.properties || true
          printf '\norg.gradle.workers.max=2\norg.gradle.parallel=true\norg.gradle.caching=true\n' >> android/gradle.properties

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -Pandroid.kotlinVersion=1.9.25

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/auralis-v2.0.0.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auralis-apk
          path: apps/auralis/dist/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Remove previous apk-latest release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          git push origin :refs/tags/apk-latest || true

      - name: Create / replace apk-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Auralis — Latest Android App
          body: |
            ## 📱 Auralis Med Spa — Mobile App (Android)

            **One app for both worlds** — on first launch you choose:

            | Mode | Access | What's inside |
            |---|---|---|
            | ✨ **Continue as Patient** | Sign in **or sign up** (self-service) | Treatment menu, booking, visits, memberships, Aura AI concierge |
            | 💼 **Continue as Staff** | Sign in only — accounts are provisioned by the clinic | Today's schedule, check-ins, patient EMR, branch switcher |

            - Package: `com.auralis.app` · Version `2.0.0`
            - New premium dark-champagne onboarding, new app icon & splash

            ### Install
            1. Download `auralis-v2.0.0.apk` on an Android 7.0+ device
            2. Allow *"Install unknown apps"* for your browser/file manager
            3. Tap the APK → Install → pick your side

            > Release builds are signed with the CI debug keystore — fine for
            > demos and internal distribution. For Google Play, upload with a
            > production keystore.
          files: apks/*.apk
          make_latest: true
